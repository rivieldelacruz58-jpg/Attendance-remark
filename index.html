<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReMark — QR Attendance</title>
<style>
  :root{
    --navy:#1E2761; --navy-dk:#162055; --teal:#0E7C7B; --orange:#E8930C;
    --bg:#F5F6FA; --card:#FFFFFF; --border:#E1E5EE; --text:#1B2440; --muted:#5B6478;
    --green-bg:#E7F3EE; --green-txt:#0E7C4F; --red-bg:#FBE9E7; --red-txt:#B3261E;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14172A; --card:#1C2038; --border:#2C3150; --text:#ECEFFA; --muted:#A3A9C2;
      --green-bg:#133227; --red-bg:#3A1C19;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14172A; --card:#1C2038; --border:#2C3150; --text:#ECEFFA; --muted:#A3A9C2;
    --green-bg:#133227; --red-bg:#3A1C19;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    background:var(--navy); color:#fff; padding:18px 20px calc(16px);
    position:sticky; top:0; z-index:5;
  }
  header h1{margin:0; font-size:20px;}
  header p{margin:2px 0 0; font-size:13px; color:#CADCFC;}
  .tabs{display:flex; gap:6px; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:62px; z-index:4; overflow-x:auto;}
  .tab{flex:1; text-align:center; padding:9px 6px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--navy); color:#fff;}
  main{padding:16px; max-width:560px; margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px;}
  .card h2{margin:0 0 10px; font-size:15px; color:var(--navy);}
  :root[data-theme="dark"] .card h2, body.dark-mode .card h2 {color:#CADCFC;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card h2{color:#CADCFC;} }
  input[type=text]{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:14px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:8px; font-weight:600; font-size:14px;}
  .btn-primary{background:var(--orange); color:#fff; padding:10px 16px;}
  .btn-secondary{background:var(--navy); color:#fff; padding:10px 16px;}
  .btn-block{width:100%;}
  .row{display:flex; gap:8px; margin-bottom:10px;}
  .student-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
  .student-row:last-child{border-bottom:none;}
  .student-name{font-size:14px; font-weight:600;}
  .student-id{font-size:12px; color:var(--muted);}
  .qr-btn{background:var(--teal); color:#fff; padding:6px 10px; font-size:12px; border-radius:6px;}
  #qrModalBack{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; align-items:center; justify-content:center;}
  #qrModal{background:#fff; border-radius:14px; padding:24px; text-align:center; max-width:280px;}
  #qrModal p{color:#222; font-weight:700; margin:10px 0 0;}
  #qrcodeImg{display:flex; justify-content:center;}
  #reader{width:100%; min-height:220px; border-radius:12px; overflow:hidden; background:#000;}
  .scan-status{margin-top:12px; padding:12px; border-radius:10px; font-size:14px; font-weight:600; text-align:center;}
  .status-ok{background:var(--green-bg); color:var(--green-txt);}
  .status-err{background:var(--red-bg); color:var(--red-txt);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:8px 6px; text-align:left; border-bottom:1px solid var(--border);}
  th{color:var(--muted); font-size:11px; text-transform:uppercase;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:20px 0;}
  .muted{color:var(--muted); font-size:12px;}
</style>
</head>
<body>

<header>
  <h1>📷 ReMark</h1>
  <p>QR Code-Based Attendance System</p>
</header>

<div class="tabs">
  <div class="tab active" data-tab="roster">Roster</div>
  <div class="tab" data-tab="scan">Scan</div>
  <div class="tab" data-tab="log">Today's Log</div>
</div>

<main>

  <!-- ROSTER -->
  <div class="view active" id="view-roster">
    <div class="card">
      <h2>Add Student</h2>
      <div class="row">
        <input type="text" id="newName" placeholder="Student name">
        <button class="btn-primary" id="addStudentBtn">Add</button>
      </div>
      <p class="muted">Each student gets a unique, single-use QR code to scan at attendance.</p>
    </div>
    <div class="card">
      <h2>Student Roster (<span id="rosterCount">0</span>)</h2>
      <div id="rosterList"><div class="empty">No students yet — add one above.</div></div>
    </div>
  </div>

  <!-- SCAN -->
  <div class="view" id="view-scan">
    <div class="card">
      <h2>Scan Attendance</h2>
      <button class="btn-secondary btn-block" id="startScanBtn">Start Scanner</button>
      <div id="reader" style="margin-top:12px;"></div>
      <div id="scanStatus" style="display:none;"></div>
    </div>
  </div>

  <!-- LOG -->
  <div class="view" id="view-log">
    <div class="card">
      <h2>Today's Attendance</h2>
      <table id="logTable" style="display:none;">
        <thead><tr><th>Time</th><th>Name</th><th>ID</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
      <div class="empty" id="logEmpty">No scans recorded yet today.</div>
    </div>
  </div>

</main>

<div id="qrModalBack">
  <div id="qrModal">
    <div id="qrcodeImg"></div>
    <p id="qrModalName"></p>
    <button class="btn-secondary" style="margin-top:14px;" id="closeQrBtn">Close</button>
  </div>
</div>

<!-- Try cdnjs first, then fall back to another CDN if it is blocked/unavailable. -->
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"
  onerror="this.onerror=null; this.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';">
</script>
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js';">
</script>
<script>
let html5Qr = null;
const todayKey = () => new Date().toISOString().slice(0,10);

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+name));
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>switchTab(t.dataset.tab)));

function genId(){ return 'S' + Math.random().toString(36).slice(2,8).toUpperCase(); }

function renderRoster(students){
  const list = document.getElementById('rosterList');
  const count = document.getElementById('rosterCount');
  count.textContent = students.length;
  if(!students.length){ list.innerHTML = '<div class="empty">No students yet — add one above.</div>'; return; }
  list.innerHTML = '';
  students.forEach(s=>{
    const row = document.createElement('div');
    row.className = 'student-row';
    row.innerHTML = `<div><div class="student-name">${escapeHtml(s.name)}</div><div class="student-id">${s.id}</div></div>`;
    const btn = document.createElement('button');
    btn.className = 'qr-btn'; btn.textContent = 'Show QR';
    btn.onclick = ()=> showQr(s.id, s.name);
    row.appendChild(btn);
    list.appendChild(row);
  });
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

function showQr(id, name){
  const box = document.getElementById('qrcodeImg');
  box.innerHTML = '';
  new QRCode(box, { text:id, width:180, height:180 });
  document.getElementById('qrModalName').textContent = name + ' (' + id + ')';
  document.getElementById('qrModalBack').style.display = 'flex';
}
document.getElementById('closeQrBtn').onclick = ()=> document.getElementById('qrModalBack').style.display='none';

function addStudent(){
  const input = document.getElementById('newName');
  const name = input.value.trim();
  if(!name) return;
  const id = genId();
  const students = loadStudents();
  students.push({ name, id });
  saveStudents(students);
  renderRoster(students.sort((a,b)=> a.name.localeCompare(b.name)));
  input.value = '';
}
document.getElementById('addStudentBtn').onclick = addStudent;

function setScanStatus(msg, ok){
  const el = document.getElementById('scanStatus');
  if(!msg){ el.style.display = 'none'; el.textContent = ''; return; }
  el.style.display = 'block';
  el.className = 'scan-status ' + (ok ? 'status-ok' : 'status-err');
  el.textContent = msg;
}

function handleScan(decodedId){
  try{
    const students = loadStudents();
    const student = students.find(s=>s.id===decodedId);
    if(!student){ setScanStatus('✕ Invalid QR code — student not found.', false); return; }
    const dk = todayKey();
    const logs = loadLogs();
    const dupe = logs.find(l=>l.studentId===decodedId && l.dateKey===dk);
    if(dupe){ setScanStatus('✕ ' + student.name + ' already logged today.', false); return; }
    logs.push({
      studentId: decodedId, name: student.name, dateKey: dk,
      timestamp: new Date().toISOString(),
      timeLabel: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})
    });
    saveLogs(logs);
    renderLog(logsForToday());
    setScanStatus('✓ Attendance logged for ' + student.name + '.', true);
  }catch(e){ console.error(e); setScanStatus('✕ Error logging attendance.', false); }
}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error(label+' timed out')), ms))
  ]);
}

async function resetScanner(){
  if(html5Qr){
    try{ await html5Qr.stop(); }catch(e){}
    try{ html5Qr.clear(); }catch(e){}
  }
  html5Qr = null;
}

document.getElementById('startScanBtn').onclick = async function(){
  if(html5Qr){ return; }
  if(typeof Html5Qrcode === 'undefined'){
    setScanStatus('\u2715 QR scanner library did not load. Check your internet connection (some networks block it), then reload the page.', false);
    return;
  }
  const btn = this;
  let settled = false;
  btn.textContent = 'Starting camera…';
  btn.disabled = true;
  setScanStatus('');

  // Hard backstop: no matter what hangs or fails silently below, this guarantees
  // the button is never stuck for more than 20 seconds.
  const watchdog = setTimeout(async ()=>{
    if(settled) return;
    settled = true;
    await resetScanner();
    btn.textContent = 'Start Scanner';
    btn.disabled = false;
    setScanStatus('✕ Camera took too long to respond. Check your browser\u2019s camera permission for this page and try again.', false);
  }, 20000);

  try{
    html5Qr = new Html5Qrcode('reader');
    const scanConfig = { fps: 10, qrbox: 220 };

    // Prefer an explicit back camera id (more reliable than facingMode on many Android/iOS browsers),
    // but never let camera discovery hang the UI — fall back to facingMode after a short timeout.
    let cameraTarget = { facingMode: 'environment' };
    try{
      const cameras = await withTimeout(Html5Qrcode.getCameras(), 6000, 'Camera list');
      if(cameras && cameras.length){
        const back = cameras.find(c => /back|rear|environment/i.test(c.label || '')) || cameras[cameras.length - 1];
        cameraTarget = back.id;
      }
    }catch(listErr){
      console.warn('Falling back to facingMode constraint:', listErr);
    }

    await withTimeout(
      html5Qr.start(cameraTarget, scanConfig, (decodedText)=> handleScan(decodedText), ()=>{}),
      12000,
      'Camera start'
    );
    if(settled) return;
    settled = true;
    clearTimeout(watchdog);
    btn.textContent = 'Scanner running';
  }catch(e){
    if(settled) return;
    settled = true;
    clearTimeout(watchdog);
    console.error('ReMark camera error:', e);
    await resetScanner();
    btn.textContent = 'Start Scanner';
    btn.disabled = false;
    const detail = (e && e.message) ? e.message : 'unknown error';
    setScanStatus('✕ Camera did not start (' + detail + '). Check permissions and try again.', false);
  }
};

function renderLog(rows){
  const body = document.getElementById('logBody');
  const table = document.getElementById('logTable');
  const empty = document.getElementById('logEmpty');
  if(!rows.length){ table.style.display='none'; empty.style.display='block'; return; }
  table.style.display='table'; empty.style.display='none';
  body.innerHTML = '';
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(r.timeLabel||'')}</td><td>${escapeHtml(r.name||'')}</td><td>${escapeHtml(r.studentId||'')}</td>`;
    body.appendChild(tr);
  });
}

// --- localStorage persistence (per-device; works offline, no account needed) ---
function loadStudents(){
  try{ return JSON.parse(localStorage.getItem('remark_students') || '[]'); }
  catch(e){ console.error(e); return []; }
}
function saveStudents(list){
  try{ localStorage.setItem('remark_students', JSON.stringify(list)); }
  catch(e){ console.error(e); }
}
function loadLogs(){
  try{ return JSON.parse(localStorage.getItem('remark_logs') || '[]'); }
  catch(e){ console.error(e); return []; }
}
function saveLogs(list){
  try{ localStorage.setItem('remark_logs', JSON.stringify(list)); }
  catch(e){ console.error(e); }
}
function logsForToday(){
  const dk = todayKey();
  return loadLogs().filter(l=>l.dateKey===dk).sort((a,b)=> b.timestamp.localeCompare(a.timestamp));
}

function checkLibraries(){
  const missing = [];
  if(typeof Html5Qrcode === 'undefined') missing.push('camera scanner');
  if(typeof QRCode === 'undefined') missing.push('QR code generator');
  if(missing.length){
    const scanBtn = document.getElementById('startScanBtn');
    scanBtn.disabled = true;
    scanBtn.textContent = 'Scanner unavailable';
    setScanStatus('\u2715 Could not load the ' + missing.join(' and ') + ' library. Check your internet connection and reload. If you opened this in an HTML viewer, open the file from an HTTPS website in Safari/Chrome; the viewer may block external scripts.', false);
  }
  return missing.length === 0;
}

function init(){
  const students = loadStudents().sort((a,b)=> a.name.localeCompare(b.name));
  renderRoster(students);
  renderLog(logsForToday());
  checkLibraries();
}
init();
</script>
</body>
</html>
